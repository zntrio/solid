version: v2
plugins:
  - local: protoc-gen-go
    out: ../api
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../api
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local: protoc-gen-go-json
    out: ../api
    opt:
      - paths=source_relative
      - orig_name=true
      - emit_defaults=true
      - allow_unknown=true
  - local: protoc-gen-go-vtproto
    out: ../api
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+pool
