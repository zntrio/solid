version: "2"

run:
  # default concurrency is the number of available CPUs
  concurrency: 4
  # timeout for analysis, e.g. 30s, 5m, default is disabled
  timeout: 20m
  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1
  # include test files or not, default is true
  tests: false
  # pass -mod=readonly to "go list": fails when go.mod needs updates. Useful in CI.
  modules-download-mode: readonly
  # Allow multiple parallel golangci-lint instances running.
  # If false (default) - golangci-lint acquires file lock on start.
  allow-parallel-runners: false

linters:
  enable:
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        Main:
          allow:
            - $gostd
            - zntr.io/solid
            - github.com/golang-jwt/jwt/v5
            - github.com/lestrrat-go/jwx/v3
            - golang.org/x/crypto
            - github.com/google/go-cmp
            - go.uber.org/mock
            - google.golang.org/protobuf
            - github.com/stretchr/testify
            - buf.build/go/protovalidate
            - github.com/go-ozzo/ozzo-validation/v4
            - go.mozilla.org/cose
            - github.com/pquerna/otp
            - github.com/dchest/uniuri
            - github.com/fxamacker/cbor/v2
            - zntr.io/paseto/v4
    gosec:
      excludes:
        - G101
    dogsled:
      # checks assignments with too many blank identifiers; default is 2
      max-blank-identifiers: 2
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`;
      # default is false: such cases aren't reported by default.
      check-type-assertions: false
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      # default is false: such cases aren't reported by default.
      check-blank: false
    exhaustive:
      # switch statements are considered exhaustive if a 'default' case is present,
      # even if all enum members aren't listed in the switch
      default-signifies-exhaustive: false
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    gocognit:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 20
    goconst:
      # minimal length of string constant, 3 by default
      min-len: 3
      # minimal occurrences count to trigger, 3 by default
      min-occurrences: 3
    nestif:
      # minimal complexity of if statements to report, 5 by default
      min-complexity: 4
    nakedret:
      # make an issue if func has more lines of code than this setting and it has naked returns; default is 30
      max-func-lines: 30
    funlen:
      lines: 100
      statements: 50
    goheader:
      template-path: .golangci-header.txt
    gocritic:
      # Enable multiple checks by tags, run `GL_DEBUG=gocritic golangci-lint run` to see all tags and checks.
      # Empty list by default. See https://github.com/go-critic/go-critic#usage -> section "Tags".
      # unslice is disabled: it misfires on fixed-size arrays (e.g. [16]byte),
      # where the slice conversion is required by the language.
      disabled-checks:
        - unslice
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
        - experimental
  exclusions:
    # Generated protobuf code and gomock mocks are not linted.
    paths:
      - api
      - ".*\\.gen\\.go$"

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(zntr.io/solid)
    gofmt:
      simplify: true
